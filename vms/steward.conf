# steward.conf - lighttpd rules for Steward (vms-lighttpd).
#
# Include it in a site's block, as phpbb.conf is included for the board:
#
#   $SERVER["socket"] == ":8443" {
#       server.document-root = "/STEWARD$ROOT/WWW"
#       include "steward.conf"
#   }
#
# Needs mod_fastcgi and mod_setenv in server.modules. The fastcgi.server ports must
# match STEWARD_POOL.COM's (count and base port: here 2 processes from 19300).
#
# Behind nginx proxy manager (DECISIONS D7), NPM terminates TLS and connects here;
# list NPM's address in STEWARD_TRUSTED_PROXIES (STEWARD_SETTINGS.COM) so Steward
# believes its X-Forwarded-* headers. HSTS belongs on the proxy, not here.

index-file.names = ( "index.html" )

# The API: everything under /api/ goes to the pool, with the path intact.
fastcgi.server = (
    "/api/" => (
        ( "host" => "127.0.0.1", "port" => 19300, "check-local" => "disable" ),
        ( "host" => "127.0.0.1", "port" => 19301, "check-local" => "disable" )
    )
)

# Page-level security headers for the static front end. The page loads only its
# own scripts, styles and images, may not be framed, and sends no referrer. The API
# sets its own (Cache-Control: no-store, X-Content-Type-Options: nosniff).
$HTTP["url"] !~ "^/api/" {
    setenv.add-response-header = (
        "Content-Security-Policy" => "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'",
        "X-Frame-Options" => "DENY",
        "Referrer-Policy" => "no-referrer",
        "X-Content-Type-Options" => "nosniff"
    )
}
